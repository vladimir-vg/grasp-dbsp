- source: |
    src := source("data")
    src :: stream(struct("k": i64, "v": i64))
    max_fn :: aggregate_function((struct("k": i64, "v": i64)) -> struct("m": i64))
    max_fn := function((row) -> struct("m": std.agg_max_i64(row.v)))
    out := aggregate(src, max_fn, by: ["k"])

  input:
    - data:
        - [1, {k: "1", v: "10"}]
        - [1, {k: "1", v: "20"}]
    - data:
        - [-1, {k: "1", v: "20"}]

  expected:
    - out:
        - [1, {k: "1", m: "20"}]
    - out:
        - [-1, {k: "1", m: "20"}]
        - [1, {k: "1", m: "10"}]

