# Circuit parameterised over a function reference.
# Circuit 'transform' applies a function to the input via map.
- source: |
    circuit transform(i: val, f: fn):
        mapped := map(val, fn)

    src := source("data")
    src :: stream(struct("v": integer))

    dec_fn := function((row) -> struct("v": row.v - 1))
    dec_fn :: function((struct("v": integer)) -> struct("v": integer))

    t := transform(i: src, f: dec_fn)
    out := t.mapped

  input:
    - data:
        - [1, {v: "5"}]

  expected:
    - out:
        - [1, {v: "4"}]
