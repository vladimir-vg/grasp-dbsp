- source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": i32))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", val: "42"}]
        - [1, {id: "2", val: "-100"}]

  expected:
    - out:
        - [1, {id: "1", val: "42"}]
        - [1, {id: "2", val: "-100"}]

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": u64))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", val: "0"}]
        - [1, {id: "2", val: "18446744073709551615"}]

  expected:
    - out:
        - [1, {id: "1", val: "0"}]
        - [1, {id: "2", val: "18446744073709551615"}]

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": f32))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", val: "3.14"}]

  expected:
    - out:
        - [1, {id: "1", val: "3.14"}]

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": integer))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", val: "99999999999999999999"}]

  expected:
    - out:
        - [1, {id: "1", val: "99999999999999999999"}]

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "attrs": map(string("UTF-8"), i64)))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", attrs: [["a", "10"], ["b", "20"]]}]

  expected:
    - out:
        - [1, {id: "1", attrs: [["a", "10"], ["b", "20"]]}]

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "coords": array(i64, 2)))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", coords: ["10", "20"]}]

  expected:
    - out:
        - [1, {id: "1", coords: ["10", "20"]}]
