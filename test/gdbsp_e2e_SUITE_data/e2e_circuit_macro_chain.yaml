# 2-link chain: c0 feeds into c1.
# c0 := step(e: src, p: src) → combined = plus(src, src) = 2*{v:5}
# c1 := step(e: src, p: c0.combined) → combined = plus(src, 2*src) = 3*{v:5}
- source: |
    circuit step(e: edge, p: path):
        combined := plus(edge, path)

    src := source("data")
    src :: stream(struct("v": i64))

    c0 := step(e: src, p: src)
    c1 := step(e: src, p: c0.combined)
    out := c1.combined

  input:
    - data:
        - [1, {v: "5"}]

  expected:
    - out:
        - [3, {v: "5"}]
