- source: |
    src := source("data")
    src :: stream(struct("id": integer, "val": integer))
    nonzero_val := function((row) -> row.val != 0)
    nonzero_val :: function((struct("id": integer, "val": integer)) -> enum("false","true"))
    zero_check := filter(src, nonzero_val)
    out := distinct(zero_check)

  input:
    - data: []
    - data:
        - [1, {id: "1", val: "100"}]
        - [1, {id: "2", val: "200"}]
    - data: []

  expected_exact:
    - {}
    - out:
        - [1, {id: "1", val: "100"}]
        - [1, {id: "2", val: "200"}]
    - {}

- source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": i64))
    out := distinct(src)

  input:
    - data:
        - [1, {id: "1", val: "100"}]
        - [-1, {id: "1", val: "100"}]
        - [1, {id: "2", val: "200"}]

  expected:
    - out:
        - [1, {id: "2", val: "200"}]

- source: |
    src := source("data")
    src :: stream(struct("id": integer, "val": integer))
    gt_0 := function((row) -> row.val >= 0)
    gt_0 :: function((struct("id": integer, "val": integer)) -> enum("false","true"))
    f := filter(src, gt_0)
    out := distinct(f)

  input:
    - data:
        - [1, {id: "1", val: "100"}]
        - [1, {id: "2", val: "-50"}]
        - [-1, {id: "1", val: "100"}]
        - [-1, {id: "2", val: "-50"}]

  expected_exact:
    - {}
