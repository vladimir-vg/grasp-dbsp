- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "sal": i64))
    sum_fn :: aggregate_function((struct("dept": i64, "sal": i64)) -> struct("total": i64))
    sum_fn := function((row) -> struct("total": std.agg_sum_i64(row.sal)))
    agg := aggregate(src, sum_fn, by: ["dept"])

  input:
    - data:
        - [1, {dept: "10", sal: "100"}]
        - [1, {dept: "10", sal: "200"}]
        - [1, {dept: "20", sal: "50"}]

  expected:
    - agg:
        - [1, {dept: "10", total: "300"}]
        - [1, {dept: "20", total: "50"}]

