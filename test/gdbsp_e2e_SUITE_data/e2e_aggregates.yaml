- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "sal": i64))
    sum_fn :: aggregate_function((struct("dept": i64, "sal": i64)) -> struct("total": i64))
    sum_fn := function((row) -> struct("total": std.agg_sum_i64(row.sal)))
    agg := aggregate(src, sum_fn, by: ["dept"])

  input:
    - data:
        - [1, {dept: "10", sal: "100"}]
        - [1, {dept: "10", sal: "200"}]
        - [1, {dept: "20", sal: "50"}]

  expected:
    - agg:
        - [1, {dept: "10", total: "300"}]
        - [1, {dept: "20", total: "50"}]

- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "score": integer))
    avg_fn :: aggregate_function((struct("dept": i64, "score": integer)) -> struct("avg": integer))
    avg_fn := function((row) -> struct("avg": std.agg_avg_integer(row.score)))
    agg := aggregate(src, avg_fn, by: ["dept"])

  input:
    - data:
        - [1, {dept: "10", score: "1"}]
        - [1, {dept: "10", score: "2"}]
        - [1, {dept: "20", score: "3"}]

  expected:
    - agg:
        - [1, {dept: "10", avg: "1"}]
        - [1, {dept: "20", avg: "3"}]

- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "sal": i64))
    sum_fn :: aggregate_function((struct("dept": i64, "sal": i64)) -> struct("total": i64))
    sum_fn := function((row) -> struct("total": std.agg_sum_i64(row.sal)))
    agg := aggregate(src, sum_fn, by: ["dept"])

  input:
    - data:
        - [1, {dept: "10", sal: "100"}]
        - [1, {dept: "10", sal: "200"}]
    - data:
        - [1, {dept: "10", sal: "50"}]
        - [1, {dept: "20", sal: "300"}]

  expected:
    - agg:
        - [1, {dept: "10", total: "300"}]
    - agg:
        - [1, {dept: "10", total: "350"}]
        - [1, {dept: "20", total: "300"}]

- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "city": string("UTF-8"), "sal": i64))
    sum_fn :: aggregate_function((struct("dept": i64, "city": string("UTF-8"), "sal": i64)) -> struct("total": i64))
    sum_fn := function((row) -> struct("total": std.agg_sum_i64(row.sal)))
    agg := aggregate(src, sum_fn, by: ["dept", "city"])

  input:
    - data:
        - [1, {dept: "10", city: "NYC", sal: "100"}]
        - [1, {dept: "10", city: "NYC", sal: "200"}]
        - [1, {dept: "10", city: "LA", sal: "50"}]

  expected:
    - agg:
        - [1, {dept: "10", city: "NYC", total: "300"}]
        - [1, {dept: "10", city: "LA", total: "50"}]
