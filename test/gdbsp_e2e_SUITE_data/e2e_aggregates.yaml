        - [1, {dept: "20", total: "300"}]

- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "city": string("UTF-8"), "sal": i64))
    sum_fn :: aggregate_function((struct("dept": i64, "city": string("UTF-8"), "sal": i64)) -> struct("total": i64))
    sum_fn := function((row) -> struct("total": std.agg_sum_i64(row.sal)))
    agg := aggregate(src, sum_fn, by: ["dept", "city"])

  input:
    - data:
        - [1, {dept: "10", city: "NYC", sal: "100"}]
        - [1, {dept: "10", city: "NYC", sal: "200"}]
        - [1, {dept: "10", city: "LA", sal: "50"}]

  expected:
    - agg:
        - [1, {dept: "10", city: "NYC", total: "300"}]
        - [1, {dept: "10", city: "LA", total: "50"}]

- source: |
    src := source("data")
