- source: |
    circuit pass_pos(x: v):
        result := filter(v, gt_zero)

    src := source("data")
    src :: stream(struct("val": integer))

    gt_zero := function((row) -> row.val > 0)
    gt_zero :: function((struct("val": integer)) -> enum("false","true"))

    fp := fixpoint(pass_pos(x: src))
    out := fp.result

  input:
    - data:
        - [1, {val: "42"}]
        - [1, {val: "-5"}]
        - [1, {val: "100"}]

  expected:
    - out:
        - [1, {val: "42"}]
        - [1, {val: "100"}]
