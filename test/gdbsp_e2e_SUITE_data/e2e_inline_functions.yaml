- description: "inline body calls dotted stdlib function (string_length, integer return)"
  source: |
    src := source("data")
    src :: stream(struct("name": string("UTF-8")))
    len := function((row) -> struct("n": std.string_length(row.name)))
    len :: function((struct("name": string("UTF-8"))) -> struct("n": integer))
    out := map(src, len)
  input:
    - data:
        - [1, {name: "ada"}]
  expected:
    - out:
        - [1, {n: "3"}]

- description: "inline function calls another inline function"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    double := function((n) -> n + n)
    double :: function((integer) -> integer)
    f := function((row) -> struct("v": double(row.x)))
    f :: function((struct("x": integer)) -> struct("v": integer))
    out := map(src, f)
  input:
    - data:
        - [1, {x: "21"}]
  expected:
    - out:
        - [1, {v: "42"}]

# ── Negative / validation ──

- description: "inline function without matching typespec fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x + 1)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "missing_typespec"

- description: "inline function return type mismatch fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x + 1)
    f :: function((struct("x": integer)) -> string("UTF-8"))
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "return_type_mismatch"

- description: "inline function positional param count mismatch fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x)
    f :: function((struct("x": integer), integer) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "param_count_mismatch"

- description: "inline function keyword param mismatch fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row, extra:) -> row.x + extra)
    f :: function((struct("x": integer), "d": integer) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "kw_param_mismatch"

- description: "inline function unbound variable fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x + unknown)
    f :: function((struct("x": integer)) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "unbound_var"

- description: "inline function calling unknown function fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> nonexistent(row.x))
    f :: function((struct("x": integer)) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "fn_lookup_error"

- description: "filter function returning non-boolean fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x + 1)
    f :: function((struct("x": integer)) -> integer)
    out := filter(src, f)
  expected_errors:
    - class: compile_error
      message: "non_boolean_filter"   # TODO(impl): define exact error term

# ── Function semantics robustness (§7.1) ──

- description: "self-recursive inline function fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    helper := function((row) -> helper(row))
    helper :: function((struct("x": integer)) -> struct("x": integer))
    out := map(src, helper)
  expected_errors:
    - class: compile_error
      message: "recursive_function"

- description: "mutually-recursive inline functions fail"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    a := function((row) -> b(row))
    a :: function((struct("x": integer)) -> struct("x": integer))
    b := function((row) -> a(row))
    b :: function((struct("x": integer)) -> struct("x": integer))
    out := map(src, a)
  expected_errors:
    - class: compile_error
      message: "recursive_function"

- description: "extra keyword argument at call site fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    double := function((n) -> n + n)
    double :: function((integer) -> integer)
    f := function((row) -> double(row.x, extra: 1))
    f :: function((struct("x": integer)) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "unexpected_kw_arg"

- description: "non-unary map function fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((a, b) -> a)
    f :: function((struct("x": integer), struct("x": integer)) -> struct("x": integer))
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "row_fn_arity"

- description: "non-unary filter function fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((a, b) -> a.x > 0)
    f :: function((struct("x": integer), struct("x": integer)) -> enum("false","true"))
    out := filter(src, f)
  expected_errors:
    - class: compile_error
      message: "row_fn_arity"

- description: "non-unary flat_map function fails"
  source: |
    src := source("data")
    src :: stream(struct("name": string("UTF-8"), "vals": array(integer)))
    unnest := function((row, extra) -> row.vals)
    unnest :: function((struct("name": string("UTF-8"), "vals": array(integer)), struct("name": string("UTF-8"), "vals": array(integer))) -> array(integer))
    expanded := flat_map(src, unnest)
    expanded :: stream(struct("name": string("UTF-8"), "v": integer, "vals": array(integer)))
  expected_errors:
    - class: compile_error
      message: "row_fn_arity"

- description: "duplicate inline function definition fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row.x)
    f := function((row) -> row.x + 1)
    f :: function((struct("x": integer)) -> integer)
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "duplicate_function"

- description: "repeated identical typespec for one definition compiles"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    f := function((row) -> row)
    f :: function((struct("x": integer)) -> struct("x": integer))
    f :: function((struct("x": integer)) -> struct("x": integer))
    out := map(src, f)
  input:
    - data:
        - [1, {x: "42"}]
  expected:
    - out:
        - [1, {x: "42"}]

- description: "inline function name colliding with stdlib fails"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    std.concat_string := function((s) -> s)
    std.concat_string :: function((string("UTF-8")) -> string("UTF-8"))
    out := map(src, std.concat_string)
  expected_errors:
    - class: compile_error
      message: "stdlib_collision"

- description: "mismatched concrete argument fails"
  source: |
    src := source("data")
    src :: stream(struct("x": i64))
    f := function((row) -> std.string_upper(row.x))
    f :: function((struct("x": i64)) -> string("UTF-8"))
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "fn_lookup_error"

- description: "dynamic argument into concrete parameter fails"
  source: |
    src := source("data")
    src :: stream(struct("x": dynamic))
    f := function((row) -> std.string_upper(row.x))
    f :: function((struct("x": dynamic)) -> string("UTF-8"))
    out := map(src, f)
  expected_errors:
    - class: compile_error
      message: "fn_lookup_error"

- description: "unary negation on integer"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    neg := function((row) -> struct("v": -row.x))
    neg :: function((struct("x": integer)) -> struct("v": integer))
    out := map(src, neg)
  input:
    - data:
        - [1, {x: "5"}]
  expected:
    - out:
        - [1, {v: "-5"}]

- description: "boolean and in filter"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    in_range := function((row) -> row.x > 0 and row.x < 10)
    in_range :: function((struct("x": integer)) -> enum("false","true"))
    out := filter(src, in_range)
  input:
    - data:
        - [1, {x: "0"}]
        - [1, {x: "5"}]
        - [1, {x: "15"}]
  expected:
    - out:
        - [1, {x: "5"}]

- description: "boolean or in filter"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    extreme := function((row) -> row.x < 0 or row.x > 10)
    extreme :: function((struct("x": integer)) -> enum("false","true"))
    out := filter(src, extreme)
  input:
    - data:
        - [1, {x: "-3"}]
        - [1, {x: "5"}]
        - [1, {x: "20"}]
  expected:
    - out:
        - [1, {x: "-3"}]
        - [1, {x: "20"}]

- description: "boolean not in filter"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    not_pos := function((row) -> not (row.x > 0))
    not_pos :: function((struct("x": integer)) -> enum("false","true"))
    out := filter(src, not_pos)
  input:
    - data:
        - [1, {x: "-3"}]
        - [1, {x: "5"}]
  expected:
    - out:
        - [1, {x: "-3"}]

- description: "boolean operator on non-boolean operands fails"
  source: |
    src := source("data")
    src :: stream(struct("a": i64, "b": i64))
    f := function((row) -> row.a and row.b)
    f :: function((struct("a": i64, "b": i64)) -> enum("false","true"))
    out := filter(src, f)
  expected_errors:
    - class: compile_error
      message: "fn_lookup_error"

- description: "std.struct_set updates an existing field"
  source: |
    src := source("data")
    src :: stream(struct("id": i64, "name": string("UTF-8")))
    fix := function((row) -> std.struct_set(row, key: "name", value: "fixed"))
    fix :: function((struct("id": i64, "name": string("UTF-8"))) -> struct("id": i64, "name": string("UTF-8")))
    out := map(src, fix)
  input:
    - data:
        - [1, {id: "1", name: "alice"}]
  expected:
    - out:
        - [1, {id: "1", name: "fixed"}]

- description: "std.struct_set with reversed kwargs (name-aware dispatch)"
  source: |
    src := source("data")
    src :: stream(struct("id": i64, "name": string("UTF-8")))
    fix := function((row) -> std.struct_set(row, value: "fixed", key: "name"))
    fix :: function((struct("id": i64, "name": string("UTF-8"))) -> struct("id": i64, "name": string("UTF-8")))
    out := map(src, fix)
  input:
    - data:
        - [1, {id: "1", name: "alice"}]
  expected:
    - out:
        - [1, {id: "1", name: "fixed"}]

- description: "non-literal struct key fails"
  source: |
    src := source("data")
    src :: stream(struct("key": string("UTF-8"), "a": i64, "b": i64))
    get := function((row) -> std.struct_get(row, key: row.key))
    get :: function((struct("key": string("UTF-8"), "a": i64, "b": i64)) -> dynamic)
    out := map(src, get)
  expected_errors:
    - class: compile_error
      message: "non_literal_key"
