# Inline (custom-defined) function end-to-end tests.
# All integer columns use the `integer` type (not fixed-width).

- description: "identity inline function via map"
  source: |
    src := source("data")
    src :: stream(struct("x": integer, "y": integer))
    id := function((row) -> row)
    id :: function((struct("x": integer, "y": integer)) -> struct("x": integer, "y": integer))
    out := map(src, id)
  input:
    - data:
        - [1, {x: "10", y: "20"}]
    - data:
        - [1, {x: "30", y: "40"}]
  expected:
    - out:
        - [1, {x: "10", y: "20"}]
    - out:
        - [1, {x: "30", y: "40"}]

- description: "inline struct construction with dot access (rename)"
  source: |
    src := source("data")
    src :: stream(struct("a": integer, "b": integer))
    rename := function((row) -> struct("x": row.a, "y": row.b))
    rename :: function((struct("a": integer, "b": integer)) -> struct("x": integer, "y": integer))
    out := map(src, rename)
  input:
    - data:
        - [1, {a: "100", b: "200"}]
  expected:
    - out:
        - [1, {x: "100", y: "200"}]

- description: "inline integer addition field to field"
  source: |
    src := source("data")
    src :: stream(struct("a": integer, "b": integer))
    total := function((row) -> struct("s": row.a + row.b))
    total :: function((struct("a": integer, "b": integer)) -> struct("s": integer))
    out := map(src, total)
  input:
    - data:
        - [1, {a: "10", b: "20"}]
  expected:
    - out:
        - [1, {s: "30"}]

- description: "inline integer literal arithmetic"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    inc := function((row) -> struct("v": row.x + 1))
    inc :: function((struct("x": integer)) -> struct("v": integer))
    out := map(src, inc)
  input:
    - data:
        - [1, {x: "41"}]
  expected:
    - out:
        - [1, {v: "42"}]

- description: "inline filter field-vs-field comparison"
  source: |
    src := source("data")
    src :: stream(struct("x": integer, "y": integer))
    big := function((row) -> row.x > row.y)
    big :: function((struct("x": integer, "y": integer)) -> enum("false","true"))
    out := filter(src, big)
  input:
    - data:
        - [1, {x: "10", y: "5"}]
        - [1, {x: "2", y: "9"}]
  expected:
    - out:
        - [1, {x: "10", y: "5"}]

- description: "inline filter literal comparison"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    ge5 := function((row) -> row.x > 5)
    ge5 :: function((struct("x": integer)) -> enum("false","true"))
    out := filter(src, ge5)
  input:
    - data:
        - [1, {x: "3"}]
        - [1, {x: "8"}]
  expected:
    - out:
        - [1, {x: "8"}]

- description: "inline flat_map unnest via dot access"
  source: |
    src := source("data")
    src :: stream(struct("name": string("UTF-8"), "vals": array(integer)))
    unnest := function((row) -> row.vals)
    unnest :: function((struct("name": string("UTF-8"), "vals": array(integer))) -> array(integer))
    expanded := flat_map(src, unnest)
    expanded :: stream(struct("name": string("UTF-8"), "v": integer, "vals": array(integer)))
  input:
    - data:
        - [1, {name: "Alice", vals: ["10", "20"]}]
        - [1, {name: "Bob", vals: ["30"]}]
  expected:
    - expanded:
        - [1, {name: "Alice", v: "10", vals: ["10", "20"]}]
        - [1, {name: "Alice", v: "20", vals: ["10", "20"]}]
        - [1, {name: "Bob", v: "30", vals: ["30"]}]

- description: "inline map preserves retractions"
  source: |
    src := source("data")
    src :: stream(struct("x": integer))
    inc := function((row) -> struct("v": row.x + 1))
    inc :: function((struct("x": integer)) -> struct("v": integer))
    out := map(src, inc)
  input:
    - data:
        - [1, {x: "10"}]
    - data:
        - [-1, {x: "10"}]
  expected:
    - out:
        - [1, {v: "11"}]
    - out:
        - [-1, {v: "11"}]

