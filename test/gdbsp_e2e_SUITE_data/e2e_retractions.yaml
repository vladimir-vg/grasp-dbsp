- source: |
    src := source("data")
    src :: stream(struct("x": i64, "y": i64))
    out := distinct(src)

  input:
    - data:
        - [1, {x: "10", y: "20"}]
        - [1, {x: "30", y: "40"}]
    - data:
        - [-1, {x: "10", y: "20"}]

  expected:
    - out:
        - [1, {x: "10", y: "20"}]
        - [1, {x: "30", y: "40"}]
    - out:
        - [-1, {x: "10", y: "20"}]

- source: |
    left := source("left")
    left :: stream(struct("k": i64, "a": i64))
    right := source("right")
    right :: stream(struct("k": i64, "b": i64))
    joined := join(left, right, on: ["k"])

  input:
    - left:
        - [1, {k: "1", a: "100"}]
      right:
        - [1, {k: "1", b: "200"}]
    - left:
        - [-1, {k: "1", a: "100"}]

  expected:
    - joined:
        - [1, {k: "1", a: "100", b: "200"}]
    - joined:
        - [-1, {k: "1", a: "100", b: "200"}]

- source: |
    pos := source("pos")
    pos :: stream(struct("k": i64, "a": i64))
    neg := source("neg")
    neg :: stream(struct("k": i64, "b": i64))
    out := antijoin(pos, neg, on: ["k"])

  input:
    - pos:
        - [1, {k: "1", a: "100"}]
        - [1, {k: "2", a: "200"}]
      neg:
        - [1, {k: "1", b: "999"}]
    - neg:
        - [-1, {k: "1", b: "999"}]

  expected:
    - out:
        - [1, {k: "2", a: "200"}]
    - out:
        - [1, {k: "1", a: "100"}]

- source: |
    src := source("data")
    src :: stream(struct("dept": i64, "sal": i64))
    agg := aggregate(src, sum_sal, by: ["dept"], value: "sal", as: "total")

  functions:
    sum_sal:
      aggregate: "agg:sum"
      args:
        - field: "sal"

  input:
    - data:
        - [1, {dept: "10", sal: "100"}]
        - [1, {dept: "10", sal: "200"}]
    - data:
        - [-1, {dept: "10", sal: "100"}]

  expected:
    - agg:
        - [1, {dept: "10", total: "300"}]
    - agg:
        - [-1, {dept: "10", total: "300"}]
        - [1, {dept: "10", total: "200"}]
