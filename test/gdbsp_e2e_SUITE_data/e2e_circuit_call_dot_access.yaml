# Circuit call with dot-notation output access.
# normalize filters → maps → dedupes via distinct.
- source: |
    circuit normalize(s: val):
        mapped := map(val, identity)
        deduped := distinct(mapped)

    src := source("data")
    src :: stream(struct("v": i64))

    identity := function((row) -> struct("v": row.v))
    identity :: function((struct("v": i64)) -> struct("v": i64))

    n := normalize(s: src)
    out := n.deduped

  input:
    - data:
        - [1, {v: "5"}]

  expected:
    - out:
        - [1, {v: "5"}]
