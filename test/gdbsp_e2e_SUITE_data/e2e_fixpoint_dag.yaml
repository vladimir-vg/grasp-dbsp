# Test 1: Diamond — Countdown fan-out to double/triple, fan-in to merge.
# Topology:  src → fp_ct → fp_double → fp_merge
#                         → fp_triple ↗
#
# fp_ct:     input {v:5} → countdown {0,1,2,3,4,5}
# fp_double: input {0..5} → double self-ref (×2) filtered <20 → {0..5, 6,8,10,12,14,16,18}
# fp_triple: input {0..5} → triple self-ref (×3) filtered <50 → {0..5, 6,9,12,15,18,27,36}
# fp_merge:  two base inputs (double + triple) → plus+distinct union
#            → {0..5, 6,8,9,10,12,14,15,16,18,27,36}
#
# E0: all produce output
# E1: retract src {v:5} → state_reset cascades through all → full retraction
- source: |
    circuit countdown(base: input, result: r):
        filtered := filter(r, gt_zero)
        next := map(filtered, dec_fn)
        combined := plus(input, next)
        result := distinct(combined)

    circuit double_lt_20(base: input, result: r):
        mapped := map(r, mult_two)
        filtered := filter(mapped, lt_20)
        combined := plus(input, filtered)
        result := distinct(combined)

    circuit triple_lt_50(base: input, result: r):
        mapped := map(r, mult_three)
        filtered := filter(mapped, lt_50)
        combined := plus(input, filtered)
        result := distinct(combined)

    circuit merge_two(base1: x, base2: y, result: r):
        combined := plus(x, y, r)
        result := distinct(combined)

    src := source("data")
    src :: stream(struct("v": i64))

    fp_ct := fixpoint(countdown(base: src, result: src))
    fp_double := fixpoint(double_lt_20(base: fp_ct.result, result: fp_ct.result))
    fp_triple := fixpoint(triple_lt_50(base: fp_ct.result, result: fp_ct.result))
    fp_merge := fixpoint(merge_two(base1: fp_double.result, base2: fp_triple.result, result: fp_double.result))

    out_ct := fp_ct.result
    out_double := fp_double.result
    out_triple := fp_triple.result
    out_merge := fp_merge.result

  functions:
    gt_zero:
      call: ">"
      args:
        - call: "std.struct_get"
          args:
            - arg: row
          kwargs:
            key:
              type: string
              value: "v"
        - {type: "i64", value: "0"}
    dec_fn:
      call: "struct"
      kwargs:
        v:
          call: "-"
          args:
            - call: "std.struct_get"
              args:
                - arg: row
              kwargs:
                key:
                  type: string
                  value: "v"
            - {type: "i64", value: "1"}
    mult_two:
      call: "struct"
      kwargs:
        v:
          call: "*"
          args:
            - call: "std.struct_get"
              args:
                - arg: row
              kwargs:
                key:
                  type: string
                  value: "v"
            - {type: "i64", value: "2"}
    mult_three:
      call: "struct"
      kwargs:
        v:
          call: "*"
          args:
            - call: "std.struct_get"
              args:
                - arg: row
              kwargs:
                key:
                  type: string
                  value: "v"
            - {type: "i64", value: "3"}
    lt_20:
      call: "<"
      args:
        - call: "std.struct_get"
          args:
            - arg: row
          kwargs:
            key:
              type: string
              value: "v"
        - {type: "i64", value: "20"}
    lt_50:
      call: "<"
      args:
        - call: "std.struct_get"
          args:
            - arg: row
          kwargs:
            key:
              type: string
              value: "v"
        - {type: "i64", value: "50"}

  input:
    - data:
        - [1, {v: "5"}]
    - data:
        - [-1, {v: "5"}]

  expected:
    - out_ct:
        - [1, {v: "0"}]
        - [1, {v: "1"}]
        - [1, {v: "2"}]
        - [1, {v: "3"}]
        - [1, {v: "4"}]
        - [1, {v: "5"}]
      out_double:
        - [1, {v: "0"}]
        - [1, {v: "1"}]
        - [1, {v: "2"}]
        - [1, {v: "3"}]
        - [1, {v: "4"}]
        - [1, {v: "5"}]
        - [1, {v: "6"}]
        - [1, {v: "8"}]
        - [1, {v: "10"}]
        - [1, {v: "12"}]
        - [1, {v: "16"}]
      out_triple:
        - [1, {v: "0"}]
        - [1, {v: "1"}]
        - [1, {v: "2"}]
        - [1, {v: "3"}]
        - [1, {v: "4"}]
        - [1, {v: "5"}]
