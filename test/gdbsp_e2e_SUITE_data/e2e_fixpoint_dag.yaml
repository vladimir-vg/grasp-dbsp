    fp_ct_a := fixpoint(countdown(base: src_a, result: src_a))
    fp_ct_b := fixpoint(countdown(base: src_b, result: src_b))
    fp_merge := fixpoint(merge_two(base1: fp_ct_a.result, base2: fp_ct_b.result, result: fp_ct_a.result))

    out_a := fp_ct_a.result
    out_b := fp_ct_b.result
    out_merge := fp_merge.result

  functions:
    gt_zero:
      call: ">"
      args:
        - call: "std.struct_get"
          args:
