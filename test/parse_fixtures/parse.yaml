- description: "Binary ops in function body"
  input: |
    add := function((x, y) -> x + y)
    sub := function((x, y) -> x - y * z)
  expected:
    - name: add
      kind: fn_def
      params:
        - {pos: x}
        - {pos: y}
      body:
        binop: '+'
        lhs: {var: x}
        rhs: {var: y}
      line: 1
    - name: sub
      kind: fn_def
      params:
        - {pos: x}
        - {pos: y}
      body:
        binop: '-'
        lhs: {var: x}
        rhs:
          binop: '*'
          lhs: {var: y}
          rhs: {var: z}
      line: 2

- description: "Precedence: and/or, comparison"
  input: |
    f := function((x, y, a, b) -> x > y and a < b)
  expected:
    - name: f
      kind: fn_def
      params:
        - {pos: x}
        - {pos: y}
        - {pos: a}
        - {pos: b}
      body:
        binop: 'and'
        lhs:
          binop: '>'
          lhs: {var: x}
          rhs: {var: y}
        rhs:
          binop: '<'
          lhs: {var: a}
          rhs: {var: b}
      line: 1

- description: "Function call in expression"
  input: |
