    src :: stream(struct("dept": i64, "x": string("UTF-8")))
    agg := aggregate(src, std.agg_count, by: ["dept"], value: "x", as: "cnt")
  expected:
    src:
      struct:
        dept: i64
        x:
          string:
            encoding: "UTF-8"
    agg:
      struct:
        dept: i64
        cnt: integer

- description: "chained filter -> distinct preserves type"
  source: |
    src := source("data")
    src :: stream(struct("x": integer, "y": integer))
    my_fn := function((row) -> row.x >= 0)
    my_fn :: function((struct("x": integer, "y": integer)) -> enum("false","true"))
    f := filter(src, my_fn)
    out := distinct(f)
  expected:
    src:
      struct:
        x: integer
        y: integer
    f:
      struct:
        x: integer
        y: integer
    out:
      struct:
        x: integer
        y: integer

- description: "neg -> plus chain"
  source: |
    src := source("data")
    src :: stream(struct("id": i64, "val": i64))
    negated := neg(src)
    out := plus(src, negated)
  expected:
    src:
      struct:
        id: i64
        val: i64
    negated:
      struct:
        id: i64
        val: i64
    out:
      struct:
        id: i64
        val: i64

