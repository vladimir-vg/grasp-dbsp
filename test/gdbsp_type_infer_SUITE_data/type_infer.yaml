- description: "source node type from typespec"
  source: |
    src := source("data")
    src :: stream(struct("x": i64, "y": i64))
  expected:
    src:
      struct:
        x: i64
        y: i64

- description: "filter inherits input type (std.struct_get on arg)"
  source: |
    src := source("data")
    src :: stream(struct("x": integer, "y": integer))
    my_fn := function((row) -> row.x >= 0)
    my_fn :: function((struct("x": integer, "y": integer)) -> enum("false","true"))
    out := filter(src, my_fn)
  expected:
    src:
      struct:
        x: integer
        y: integer
    out:
      struct:
        x: integer
        y: integer

- description: "distinct inherits input type"
  source: |
    src := source("data")
    src :: stream(struct("x": i64, "y": i64))
    out := distinct(src)
  expected:
    src:
      struct:
        x: i64
        y: i64
    out:
      struct:
        x: i64
        y: i64

- description: "plus inherits input type"
  source: |
    a := source("a")
    a :: stream(struct("x": i64))
    b := source("b")
    b :: stream(struct("x": i64))
    out := plus(a, b)
  expected:
    a:
      struct:
        x: i64
    b:
      struct:
        x: i64
    out:
      struct:
        x: i64

- description: "neg inherits input type"
  source: |
    src := source("data")
    src :: stream(struct("x": i64, "y": i64))
    negated := neg(src)
  expected:
    src:
      struct:
        x: i64
        y: i64
    negated:
      struct:
        x: i64
        y: i64

- description: "project subsets struct fields"
  source: |
    src := source("data")
    src :: stream(struct("name": string("UTF-8"), "age": i64, "city": string("UTF-8")))
    out := project(src, ["name", "city"])
  expected:
    src:
      struct:
        name:
          string:
            encoding: "UTF-8"
        age: i64
        city:
          string:
            encoding: "UTF-8"
    out:
      struct:
        name:
          string:
            encoding: "UTF-8"
        city:
          string:
            encoding: "UTF-8"

- description: "map with struct constructor (std.struct_get fields from arg)"
  source: |
    src := source("data")
    src :: stream(struct("id": i64, "a": i64, "b": i64))
    rename_fn := function((row) -> struct("x": row.a, "y": row.b))
    rename_fn :: function((struct("id": i64, "a": i64, "b": i64)) -> struct("x": i64, "y": i64))
    out := map(src, rename_fn)
  expected:
    src:
      struct:
        id: i64
        a: i64
        b: i64
    out:
      struct:
        x: i64
        y: i64

- description: "map with std.struct_get infers exact field type"
  source: |
    src := source("data")
    src :: stream(struct("x": i64, "y": string("UTF-8")))
    pick_x := function((row) -> row.x)
    pick_x :: function((struct("x": i64, "y": string("UTF-8"))) -> i64)
    out := map(src, pick_x)
  expected:
    src:
      struct:
        x: i64
        y:
          string:
            encoding: "UTF-8"
    out: i64

- description: "map with arg reference returns input type (pass-through)"
  source: |
    src := source("data")
    src :: stream(struct("a": i64, "b": i64))
    passthrough := function((row) -> row)
    passthrough :: function((struct("a": i64, "b": i64)) -> struct("a": i64, "b": i64))
    out := map(src, passthrough)
  expected:
    out:
      struct:
        a: i64
        b: i64

- description: "join merges left and right struct types"
  source: |
    left_src := source("left")
    left_src :: stream(struct("k": i64, "a": i64))
    right_src := source("right")
    right_src :: stream(struct("k": i64, "b": i64))
    joined := join(left_src, right_src, on: ["k"])
  expected:
    left_src:
      struct:
        k: i64
        a: i64
    right_src:
      struct:
        k: i64
        b: i64
    joined:
      struct:
        k: i64
        a: i64
        b: i64

- description: "aggregate with sum"
  source: |
    src := source("data")
    src :: stream(struct("dept": i64, "sal": i64))
    agg := aggregate(src, std.agg_sum_integer, by: ["dept"], value: "sal", as: "total")
  expected:
    src:
      struct:
        dept: i64
        sal: i64
    agg:
      struct:
        dept: i64
        total: integer

- description: "aggregate with count"
