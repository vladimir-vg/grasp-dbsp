        x: i64
        y: i64

- description: "map struct constructor with unrecognized sub-expr falls back to dynamic"
  source: |
    src := source("data")
    src :: stream(struct("a": i64, "b": i64))
    out := map(src, weird_struct)
  functions:
    weird_struct:
      call: struct
      kwargs:
        x:
          garbage: true
  expected:
    out:
      struct:
        x: dynamic

