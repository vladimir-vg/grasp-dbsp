- description: "map with struct:set updates field type in output"
  source: |
    src := source("data")
    src :: stream(struct("id": i64, "name": string("UTF-8")))
    out := map(src, fix_name)
  functions:
    fix_name:
      call: "struct:set"
      args:
        - arg: row
        - type: string
          value: "fixed"
      kwargs:
        key:
          type: string
          value: "name"
  expected:
    out:
      struct:
        id: i64
        name: string

- description: "std.struct_get with non-constant key degrades to dynamic"
  source: |
    src := source("data")
    src :: stream(struct("key": string("UTF-8"), "a": i64, "b": i64))
    out := map(src, get_by_key)
  functions:
    get_by_key:
      call: "std.struct_get"
      args:
        - arg: row
      kwargs:
        key:
          call: "std.struct_get"
          args:
            - arg: row
          kwargs:
            key:
              type: string
              value: "key"
  expected:
    out: dynamic
