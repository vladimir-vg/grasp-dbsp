- description: "antijoin inherits left input type"
  source: |
    left_src := source("left")
    left_src :: stream(struct("k": i64, "a": i64))
    right_src := source("right")
    right_src :: stream(struct("k": i64, "b": i64))
    aj := antijoin(left_src, right_src, on: ["k"])
  expected:
    aj:
      struct:
        k: i64
        a: i64

- description: "map with gte call infers boolean return"
  source: |
    src := source("data")
    src :: stream(struct("x": i64))
    out := map(src, is_pos)
  functions:
    is_pos:
      call: gte
      args:
        - field: x
        - type: i64
          value: "0"
  expected:
    out: boolean

- description: "map with string:upper call infers string return"
  source: |
    src := source("data")
    src :: stream(struct("name": string("UTF-8")))
    out := map(src, up)
  functions:
    up:
      call: "string:upper"
      args:
        - field: name
  expected:
    out: string

- description: "source without type annotation fails"
  source: |
    src := source("data")
  expected_errors:
    - class: missing_typespec
      node: src

- description: "cycle without delay fails"
  source: |
    src := source("data")
    src :: stream(struct("x": i64))
    a := map(b, fn)
    b := map(a, fn)
  expected_errors:
    - class: cycle
