- description: "fixpoint output inherits input type (covers fixpoint_input too)"
  source: |
    circuit passthrough(x: val):
        result := distinct(val)
    src := source("data")
    src :: stream(struct("a": i64, "b": i64))
    fp := fixpoint(passthrough(x: src))
    out := fp.result
  expected:
    fp.result:
      struct:
        a: i64
        b: i64

